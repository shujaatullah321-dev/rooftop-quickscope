name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Add the upload key (from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload-key.jks
            echo "Upload key found: the build will be ready for Google Play."
          else
            echo "::warning::No KEYSTORE_BASE64 secret. The build is test-only and Google Play will not accept it."
          fi

      - name: Build APK and App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Save the app files
        uses: actions/upload-artifact@v4
        with:
          name: rooftop-quickscope-android
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publish the phone download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk rooftop-quickscope.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build rooftop-quickscope.apk --title "Latest build" --notes "Open this page on an Android phone and tap rooftop-quickscope.apk to install the game." --latest
