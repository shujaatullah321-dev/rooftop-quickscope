name: Build Android app and web game

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Add the upload key (from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
            echo "Key text length: ${#CLEAN} characters (expected 3532)"
            echo "Password length: ${#KEYSTORE_PASSWORD} characters (expected 24)"
            printf '%s' "$CLEAN" | base64 -d > app/upload-key.jks || { echo "::error::KEYSTORE_BASE64 is not valid key text. Paste the whole KEYSTORE_BASE64.txt again."; exit 1; }
            echo "Key file size: $(stat -c %s app/upload-key.jks) bytes (expected 2648)"
            keytool -list -keystore app/upload-key.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 || { echo "::error::The key and password do not match. Check KEYSTORE_PASSWORD and KEYSTORE_BASE64."; exit 1; }
            echo "Upload key found: the build will be ready for Google Play."
          else
            echo "::warning::No KEYSTORE_BASE64 secret. The build is test-only and Google Play will not accept it."
          fi

      - name: Build APK and App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Save the app files
        uses: actions/upload-artifact@v4
        with:
          name: rooftop-quickscope-android
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publish the phone download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk rooftop-quickscope.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build rooftop-quickscope.apk --title "Latest build" --notes "Open this page on an Android phone and tap rooftop-quickscope.apk to install the game." --latest

  web:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Put both games on the site
        run: |
          mkdir -p _site
          cp -r app/src/main/assets/www/. _site/
          mkdir -p _site/hand-in-hand
          cp -r hand-in-hand/app/src/main/assets/www/. _site/hand-in-hand/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
